[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-router-agent"
version = "0.1.0"
description = "Voice-controlled hub for home network and mock appliances"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "loguru>=0.7",
    "edge-tts>=6.1",
    "paramiko>=3.4",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "openai>=1.30",
    "aliyun-python-sdk-core>=2.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["server*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
